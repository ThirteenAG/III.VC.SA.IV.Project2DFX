name: GitHub Actions Build

on:
  push:
    paths-ignore:
      - "**/*.md"
      - '**/*.txt'
    branches:
      - '**'
  pull_request:
    paths-ignore:
      - "**/*.md"
      - '**/*.txt'
  workflow_dispatch:
    inputs:
      release:
        description: "Create a release"
        type: choice
        required: false
        default: 'none'
        options:
          - 'none'
          - 'all'
          - 'gta3'
          - 'gtavc'
          - 'gtasa'
          - 'gtaiv'
          - 'gtavcsps2'
          - 'gtalcsps2'
          - 'gtavcs'
          - 'gtalcs'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@main

    - name: Configure build
      run: ./premake5.bat

    - name: Build
      run: |
        msbuild -m build/III.VC.SA.IV.Project2DFX.slnx /property:Configuration=Release /property:Platform=Win32
        msbuild -m build/Project2DFX.PS2.slnx /property:Configuration=Release /property:Platform=PS2
        msbuild -m build/Project2DFX.PSP.slnx /property:Configuration=Release /property:Platform=PSP

    - name: Download III.VC.SA.LimitAdjuster
      uses: robinraju/release-downloader@v1.13
      with:
        repository: "GTAmodding/III.VC.SA.LimitAdjuster"
        latest: true
        fileName: "III.VC.SA.LimitAdjuster.zip"
 
    - name: Unpack dependencies
      run: |
          7z x III.VC.SA.LimitAdjuster.zip -odata/IIILodLights/ -y
          7z x III.VC.SA.LimitAdjuster.zip -odata/VCLodLights/ -y
          7z x III.VC.SA.LimitAdjuster.zip -odata/SALodLights/ -y
          del III.VC.SA.LimitAdjuster.zip

    - name: Pack binaries
      shell: cmd
      run: |
        cd data
        ./release.bat
        cd ..

    - name: Upload IIILodLights artifact
      uses: actions/upload-artifact@v7
      with:
        archive: false
        path: data/III.Project2DFX.zip

    - name: Upload VCLodLights artifact
      uses: actions/upload-artifact@v7
      with:
        archive: false
        path: data/VC.Project2DFX.zip

    - name: Upload SALodLights artifact
      uses: actions/upload-artifact@v7
      with:
        archive: false
        path: data/SA.Project2DFX.zip

    - name: Upload IVLodLights artifact
      uses: actions/upload-artifact@v7
      with:
        archive: false
        path: data/IV.Project2DFX.zip

    - name: Upload GTAVCS.PCSX2F.Project2DFX artifact
      uses: actions/upload-artifact@v7
      with:
        archive: false
        path: data/GTAVCS.PCSX2F.Project2DFX.zip

    - name: Upload GTALCS.PCSX2F.Project2DFX artifact
      uses: actions/upload-artifact@v7
      with:
        archive: false
        path: data/GTALCS.PCSX2F.Project2DFX.zip

    - name: Upload GTAVCS.PPSSPP.Project2DFX artifact
      uses: actions/upload-artifact@v7
      with:
        archive: false
        path: data/GTAVCS.PPSSPP.Project2DFX.zip

    - name: Upload GTALCS.PPSSPP.Project2DFX artifact
      uses: actions/upload-artifact@v7
      with:
        archive: false
        path: data/GTALCS.PPSSPP.Project2DFX.zip

    # Uploads the packages to their existing releases (one release per game, by tag; their names stay as they are, the
    # body comes from .github/docs). "all" releases every game: a failure is reported per game and the others go on.
    - name: Upload releases
      if: |
        github.event.inputs.release != '' && github.event.inputs.release != 'none' &&
        github.ref_name == 'master' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.repository == 'ThirteenAG/III.VC.SA.IV.Project2DFX'
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE: ${{ github.event.inputs.release }}
      run: |
        $games = [ordered]@{
          'gta3'      = @{ asset = 'data/III.Project2DFX.zip';            doc = '.github/docs/iii.md' }
          'gtavc'     = @{ asset = 'data/VC.Project2DFX.zip';             doc = '.github/docs/vc.md' }
          'gtasa'     = @{ asset = 'data/SA.Project2DFX.zip';             doc = '.github/docs/sa.md' }
          'gtaiv'     = @{ asset = 'data/IV.Project2DFX.zip';             doc = '.github/docs/iv.md' }
          'gtavcsps2' = @{ asset = 'data/GTAVCS.PCSX2F.Project2DFX.zip'; doc = '.github/docs/vcsps2.md' }
          'gtalcsps2' = @{ asset = 'data/GTALCS.PCSX2F.Project2DFX.zip'; doc = '.github/docs/lcsps2.md' }
          'gtavcs'    = @{ asset = 'data/GTAVCS.PPSSPP.Project2DFX.zip'; doc = '.github/docs/vcspsp.md' }
          'gtalcs'    = @{ asset = 'data/GTALCS.PPSSPP.Project2DFX.zip'; doc = '.github/docs/lcspsp.md' }
        }
        $tags = if ($env:RELEASE -eq 'all') { @($games.Keys) } else { @($env:RELEASE) }
        $results = @()
        foreach ($tag in $tags)
        {
          $game = $games[$tag]
          try
          {
            if (-not $game) { throw "unknown release '$tag'" }
            if (-not (Test-Path $game.asset)) { throw "$($game.asset) wasn't built" }
            gh release view $tag --repo $env:GITHUB_REPOSITORY --json name --jq .name | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "no release with the tag $tag (create it first)" }
            gh release upload $tag $game.asset --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw "uploading $($game.asset) failed" }
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --notes-file $game.doc
            if ($LASTEXITCODE -ne 0) { throw "updating the release notes failed" }
            $results += "| $tag | ok | $(Split-Path $game.asset -Leaf) |"
          }
          catch
          {
            Write-Output "::error title=Release $tag::$($_.Exception.Message)"
            $results += "| $tag | FAILED | $($_.Exception.Message) |"
          }
        }
        "## Releases`n`n| Release | Result | |`n|---|---|---|`n" + ($results -join "`n") | Out-File -Append $env:GITHUB_STEP_SUMMARY
        $results | ForEach-Object { Write-Output $_ }
        if ($results -match 'FAILED') { exit 1 }
