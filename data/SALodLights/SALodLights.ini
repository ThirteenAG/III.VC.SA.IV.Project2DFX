[LodLights]
RenderLodLights = 1
MaxNumberOfLodLights = 25000
CoronaRadiusMultiplier = 0.5
SlightlyIncreaseRadiusWithDistance = 1
CoronaAlphaNearMinMult = 0.5             ; alpha multiplier for nearby coronas
CoronaAlphaReachOneAt = 150.0            ; distance where alpha multiplier reaches 1.0
CoronaAlphaBoostStartAt = 150.0          ; start boosting after this
CoronaAlphaFarBoostMax = 4.0             ; max boost for distant coronas
CoronaFarClip = auto
MaxNumberOfDistantCars = 1000
MaritimeTraffic = 1                      ; 1 = distant boat lights on water paths, 0 = disabled
DistantCarsRadiusMultiplier = 1.0
DistantCars3D = 1
DistantBoats3D = 1
DistantCars3DLights = 1

[StaticShadows]
StaticShadowsIntensity = 2.0
StaticShadowsDrawDistance = 200.0

[SearchLights]
RenderSearchlightEffects = 1
RenderOnlyDuringFoggyWeather = 0
SearchlightEffectVisibilityFactor = 0.4

[FarClip]
FarClipMultiplier =  0.0                 ; 0.0 = dynamic, <= 10.0 = fixed multiplier (e.g. 5.0), > 10.0 = static farclip
HeightFactor = 0.05
MinMultiplier = 2.0
MaxMultiplier = 4.0
TargetFPS = 60
StaticSunSize = 20.0

[IDETweaker]
TimedObjectsDrawDistance = 0.0           ; All values below 10.0 will be used as a multiplier, otherwise as a draw distance.
LODObjectsDrawDistance = 1300.0
GenericObjectsDrawDistance = 300.0
AllNormalObjectsDrawDistance = 0.0
VegetationDrawDistance = 800.0
ProceduralObjectsDrawDistance = 40.0     ; Absolute draw distance for generated instances only; capped at 150. 0 disables the override and automatic generation distances. Restart required.
; Generation uses multiplier 1.8: a fixed 20-unit margin beyond the outer fade boundary, then a default 40-unit generation window.
; Only the generation window narrows at the 340-unit outer cache limit. The shared grass/triangle cache stays at least 100.
; Higher procobj.dat MINDIST values are preserved and may exceed the automatic generation window.
ProceduralGrassDrawDistance = 0.0        ; Base grass fade-start distance, scaled by the camera draw-distance multiplier; capped at 150. 0 preserves vanilla grass distances. Restart required.
; Native grass fades over the next 20 units. High/Very High FX use the full range, Medium halves the start distance, Low disables grass.
; Cache sizing uses multiplier 1.8: up to 270 fade-start + 20 fade + 20 margin within the 340-unit outer cache. Slider changes apply live.
; The shared triangle cache automatically covers both grass and procedural objects.
PreloadLODs = 1
